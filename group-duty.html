<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="몬자야키">
<meta name="theme-color" content="#F8F4ED">
<title>몬자야키</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{
    min-height:100vh;min-height:100dvh;
    background:linear-gradient(168deg,#FAF7F0 0%,#F5EFE5 55%,#F8F2E8 100%);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#3A3A4A;
    -webkit-user-select:none;user-select:none;
    padding-top:max(0px,env(safe-area-inset-top));
    padding-bottom:max(0px,env(safe-area-inset-bottom));
  }
  button{font-family:inherit;-webkit-tap-highlight-color:transparent;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
  input,select,textarea{font-family:inherit;-webkit-appearance:none;outline:none;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slideDown{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .anim-fade{animation:fadeIn 0.2s ease}
  .anim-up{animation:slideUp 0.28s cubic-bezier(0.2,0.85,0.25,1)}
  .anim-down{animation:slideDown 0.22s ease}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, set, get, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBoWEww6yUb9bjSTy5oyNPTFTuHT07ppTQ",
  authDomain: "our-schedule-ee491.firebaseapp.com",
  databaseURL: "https://our-schedule-ee491-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "our-schedule-ee491",
  storageBucket: "our-schedule-ee491.firebasestorage.app",
  messagingSenderId: "397619973905",
  appId: "1:397619973905:web:ef54d6ff04d16e6ac0c6b0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const ROOT = "group_schedule_v1";

// 상수
const el = React.createElement;
const {useState, useEffect, useMemo, useRef, useCallback} = React;
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const SHIFT = { D:{label:"D",full:"데이",color:"#7EC8E3",light:"#E8F4FA"}, E:{label:"E",full:"이브닝",color:"#8FD5A6",light:"#EAFAF0"}, N:{label:"N",full:"나이트",color:"#F5D76E",light:"#FDF8E8"}, O:{label:"O",full:"오프",color:"#D4A0D0",light:"#F5EAF4"} };
const RESERVED_CODES = ["D","E","N","O"];
const MEMBER_COLORS = ["#5B9BD5","#C07ABC","#E8746E","#F5A623","#6FB89B","#B89B6E","#D88F89","#5A8DBA","#9B6FB5","#C685A8","#6B7FA5","#B47B5C","#7BA98F","#BD7E89"];
const MEMO_COLOR = "#FF5C5C";
const MAX_MEMBERS = 14;
const GRAY_COLOR = "#BEB5A8";
const dKey = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

// ───── 메인 앱 ─────
function App(){
  const [view,setView] = useState("loading");
  const [authMode,setAuthMode] = useState("login");
  const [me,setMe] = useState(null);
  const [members,setMembers] = useState({});
  const [schedules,setSchedules] = useState({});
  const [memos,setMemos] = useState({});
  const [perspective,setPerspective] = useState(null);
  const today = new Date();
  const [year,setYear] = useState(today.getFullYear());
  const [month,setMonth] = useState(today.getMonth());

  useEffect(()=>{ 
    const savedId = localStorage.getItem("group_duty_me");
    if(savedId){ setMe(savedId); setPerspective(savedId); }
    setView(savedId ? "main" : "auth");
  },[]);

  useEffect(()=>{
    const unsubM = onValue(ref(db,`${ROOT}/members`), s=> setMembers(s.val()||{}));
    const unsubS = onValue(ref(db,`${ROOT}/schedules`), s=> setSchedules(s.val()||{}));
    const unsubMe = onValue(ref(db,`${ROOT}/memos`), s=> setMemos(s.val()||{}));
    return ()=>{ unsubM(); unsubS(); unsubMe(); };
  },[]);

  const handleLogin = useCallback((memberId)=>{ localStorage.setItem("group_duty_me", memberId); setMe(memberId); setPerspective(memberId); setView("main"); },[]);
  const handleLogout = useCallback(()=>{ localStorage.removeItem("group_duty_me"); setMe(null); setPerspective(null); setView("auth"); },[]);

  if(view==="loading") return el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100dvh",color:"#A0A0A8"}},"...");
  if(view==="auth") return el(AuthScreen,{mode:authMode, setMode:setAuthMode, members, onLogin:handleLogin});
  return el(CalendarScreen,{ me, members, schedules, memos, perspective, setPerspective, year, month, setYear, setMonth, onLogout:handleLogout });
}

// ───── 인증 화면 ─────
function AuthScreen({mode,setMode,members,onLogin}){
  const memberCount = Object.keys(members).length;
  return el("div",{style:{minHeight:"100dvh",padding:"56px 24px 32px",display:"flex",flexDirection:"column"}},
    el("div",{style:{textAlign:"center",marginBottom:48}},
      el("div",{style:{fontSize:52,marginBottom:8}},"🩺"),
      el("h1",{style:{fontSize:24,fontWeight:800,letterSpacing:"-0.02em",color:"#2D2D3A"}},"몬자야키"),
      el("p",{style:{fontSize:13,color:"#9C8F7C",marginTop:6,letterSpacing:"-0.01em"}},`현재 ${memberCount}명 / 최대 ${MAX_MEMBERS}명`)
    ),
    el("div",{style:{display:"flex",gap:8,padding:4,background:"rgba(255,255,255,0.5)",borderRadius:14,marginBottom:24}},
      ["login","signup"].map(m=> el("button",{key:m,onClick:()=>setMode(m), style:{flex:1,padding:"12px 0",borderRadius:10, background:mode===m?"#FFFFFF":"transparent", color:mode===m?"#2D2D3A":"#9C8F7C", fontWeight:mode===m?700:500, fontSize:14, boxShadow:mode===m?"0 2px 8px rgba(180,160,130,0.15)":"none", transition:"all 0.2s"}}, m==="login"?"로그인":"가입"))
    ),
    mode==="login" ? el(LoginForm,{members,onLogin}) : el(SignupForm,{members,memberCount,onLogin})
  );
}

function LoginForm({members,onLogin}){
  const [selectedId,setSelectedId] = useState("");
  const [pw,setPw] = useState("");
  const [err,setErr] = useState("");
  const memberList = Object.entries(members).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  const handleSubmit = ()=>{
    if(!selectedId) return setErr("이름을 선택해");
    if(pw.length!==4) return setErr("비번 4자리");
    if(members[selectedId].password!==pw) return setErr("비번 틀림");
    setErr("");
    onLogin(selectedId);
  };
  return el("div",{className:"anim-down",style:{display:"flex",flexDirection:"column",gap:14}},
    el("div",{style:{background:"rgba(255,255,255,0.6)",borderRadius:14,padding:"4px 6px"}},
      el("div",{style:{padding:"4px 12px 0",fontSize:11,color:"#9C8F7C",fontWeight:600}},"이름"),
      memberList.length===0
        ? el("div",{style:{padding:"14px 12px",fontSize:14,color:"#B0A496"}},"아직 가입한 사람이 없어. 가입 탭으로 가서 첫 멤버가 되어줘.")
        : el("div",{style:{display:"flex",flexWrap:"wrap",gap:6,padding:"8px 8px 10px"}},
          memberList.map(([id,m])=> el("button",{key:id,onClick:()=>setSelectedId(id), style:{padding:"7px 12px",borderRadius:20, background:selectedId===id?m.color:"#FFFFFF", color:selectedId===id?"#FFFFFF":"#3A3A4A", fontSize:13,fontWeight:selectedId===id?700:500, border:`1.5px solid ${selectedId===id?m.color:"#EFE6D5"}`, transition:"all 0.15s"}}, m.name))
        )
    ),
    el("div",{style:{background:"rgba(255,255,255,0.6)",borderRadius:14,padding:"14px 16px"}},
      el("div",{style:{fontSize:11,color:"#9C8F7C",fontWeight:600,marginBottom:8}},"비밀번호 4자리"),
      el("input",{type:"tel",inputMode:"numeric",pattern:"[0-9]*",maxLength:4, value:pw,onChange:e=>setPw(e.target.value.replace(/\D/g,"").slice(0,4)), placeholder:"••••", style:{width:"100%",fontSize:22,letterSpacing:"0.5em",fontWeight:700,textAlign:"center",color:"#3A3A4A",padding:"4px 0"}})
    ),
    err && el("div",{style:{fontSize:13,color:MEMO_COLOR,textAlign:"center"}},err),
    el("button",{onClick:handleSubmit, style:{marginTop:8,padding:"16px 0",borderRadius:14, background:"#2D2D3A",color:"#FFFFFF", fontSize:15,fontWeight:700,letterSpacing:"-0.01em"}},"들어가기")
  );
}

// 🔥 여기만 수정된 가입 화면
function SignupForm({members,memberCount,onLogin}){
  const [name,setName] = useState("");
  const [bMonth,setBMonth] = useState("");
  const [bDay,setBDay] = useState("");
  const [phone,setPhone] = useState("");
  const [pw,setPw] = useState("");
  const [pw2,setPw2] = useState("");
  const [color,setColor] = useState(MEMBER_COLORS[0]);
  const [err,setErr] = useState("");
  const usedColors = new Set(Object.values(members).map(m=>m.color));
  const usedNames = new Set(Object.values(members).map(m=>m.name));

  const handleSubmit = async()=>{
    if(memberCount>=MAX_MEMBERS) return setErr(`최대 ${MAX_MEMBERS}명`);
    const trimmedName = name.trim();
    if(trimmedName.length !== 3 || !/^[가-힣]{3}$/.test(trimmedName)) 
      return setErr("이름은 정확히 한글 3자만 가능합니다 (예: 신정우)");
    if(usedNames.has(trimmedName)) return setErr("이미 있는 이름");
    const m=parseInt(bMonth),d=parseInt(bDay);
    if(!(m>=1&&m<=12)||!(d>=1&&d<=31)) return setErr("생일 확인");
    if(!phone) return setErr("전화번호");
    if(pw.length!==4) return setErr("비번 4자리");
    if(pw!==pw2) return setErr("비번 확인 불일치");
    setErr("");
    const newRef = push(ref(db,`${ROOT}/members`));
    const id = newRef.key;
    await set(newRef,{ name:trimmedName, birthMonth:m, birthDay:d, phone:phone, password:pw, color, joinedAt:Date.now() });
    onLogin(id);
  };

  return el("div",{className:"anim-down",style:{display:"flex",flexDirection:"column",gap:12}},
    field("이름", el("input",{ type:"text",value:name, onChange:e=>setName(e.target.value), placeholder:"한글 3자 (예: 신정우)", maxLength:3, style:inputStyle() })),
    field("생일 (양력)", el("div",{style:{display:"flex",gap:8,alignItems:"center"}},
      el("input",{type:"tel",inputMode:"numeric",value:bMonth,onChange:e=>setBMonth(e.target.value.replace(/\D/g,"").slice(0,2)),placeholder:"월",style:{...inputStyle(),width:60,textAlign:"center"}}),
      el("span",{style:{color:"#B0A496"}},"/"),
      el("input",{type:"tel",inputMode:"numeric",value:bDay,onChange:e=>setBDay(e.target.value.replace(/\D/g,"").slice(0,2)),placeholder:"일",style:{...inputStyle(),width:60,textAlign:"center"}})
    )),
    field("전화번호", el("input",{ type:"tel",value:phone,onChange:e=>setPhone(e.target.value.replace(/\D/g,"").slice(0,11)), placeholder:"01012345678", style:inputStyle() })),
    field("비밀번호 4자리", el("div",{style:{display:"flex",gap:8}},
      el("input",{type:"tel",inputMode:"numeric",maxLength:4,value:pw,onChange:e=>setPw(e.target.value.replace(/\D/g,"").slice(0,4)),placeholder:"••••",style:{...inputStyle(),flex:1,letterSpacing:"0.4em",textAlign:"center"}}),
      el("input",{type:"tel",inputMode:"numeric",maxLength:4,value:pw2,onChange:e=>setPw2(e.target.value.replace(/\D/g,"").slice(0,4)),placeholder:"확인",style:{...inputStyle(),flex:1,letterSpacing:"0.4em",textAlign:"center"}})
    )),
    field("내 색상", el("div",{style:{display:"flex",flexWrap:"wrap",gap:8,paddingTop:4}},
      MEMBER_COLORS.map(c=>{
        const used = usedColors.has(c) && c!==color;
        return el("button",{key:c,onClick:()=>!used&&setColor(c), style:{width:32,height:32,borderRadius:"50%", background:used?"#E6DDC9":c, border:color===c?"3px solid #2D2D3A":"3px solid transparent", opacity:used?0.4:1, cursor:used?"not-allowed":"pointer", transition:"all 0.15s"}});
      })
    )),
    err && el("div",{style:{fontSize:13,color:MEMO_COLOR,textAlign:"center",marginTop:4}},err),
    el("button",{onClick:handleSubmit, style:{marginTop:8,padding:"16px 0",borderRadius:14, background:"#2D2D3A",color:"#FFFFFF", fontSize:15,fontWeight:700}},"가입하기")
  );
}

const inputStyle = ()=>({ width:"100%",fontSize:15,padding:"10px 12px", background:"#FFFFFF",borderRadius:10, border:"1px solid #EFE6D5",color:"#3A3A4A" });
function field(label,child){ return el("div",{style:{display:"flex",flexDirection:"column",gap:6}}, el("div",{style:{fontSize:11,color:"#9C8F7C",fontWeight:600,paddingLeft:2}},label), child); }

// ───── 나머지 모든 화면 (캘린더, 설정, 연락처 등) ─────
function CalendarScreen(props){ /* ... (이전과 동일한 전체 코드) ... */ }
function Header(props){ /* ... */ }
function WeekdayRow(){ /* ... */ }
function CalendarGrid(props){ /* ... */ }
function DayCell(props){ /* ... */ }
function statMini(n,color){ return el("span",{key:Math.random(),style:{fontSize:9,fontWeight:700,color:n>0?color:"#D5C9B0",lineHeight:1}},n); }
function sep(){ return el("span",{key:Math.random(),style:{fontSize:8,color:"#D5C9B0",lineHeight:1}},"·"); }
function PersonPicker(props){ /* ... */ }
function InputDrawer(props){ /* ... */ }
function DayModal(props){ /* ... */ }
function MyDutyEditor(props){ /* ... */ }
function MemoSection(props){ /* ... */ }
function ContactsPanel(props){ /* ... */ }
function SettingsModal(props){ /* ... */ }

// 마운트
ReactDOM.createRoot(document.getElementById("app")).render(el(App));
</script>
</body>
</html>
